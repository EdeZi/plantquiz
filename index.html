<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f35">
  <meta name="description" content="PlantQuiz transforme la biologie végétale en sessions de quiz adaptatives, révisions ciblées et énigmes Pédantix.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:title" content="PlantQuiz — Cultivez vos connaissances">
  <meta property="og:description" content="Quiz adaptatif, révisions par semestre et Pédantix végétal dans une expérience simple et vivante.">
  <meta property="og:url" content="https://edezi.github.io/plantquiz/">
  <meta property="og:image" content="https://edezi.github.io/plantquiz/assets/og-card.png">
  <meta property="og:image:alt" content="PlantQuiz — Cultivez vos connaissances.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://edezi.github.io/plantquiz/assets/og-card.png">
  <link rel="canonical" href="https://edezi.github.io/plantquiz/">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./assets/styles.css?v=3">
  <title>PlantQuiz — Cultivez vos connaissances</title>
</head>
<body>
  <a class="skip-link" href="#app">Aller au contenu</a>

  <div class="site-shell">
    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="#/home" aria-label="PlantQuiz, accueil">
          <span class="brand__mark" aria-hidden="true">P</span>
          <span class="brand__text">
            <strong>PlantQuiz</strong>
            <small>Biologie végétale</small>
          </span>
        </a>

        <nav class="main-nav" aria-label="Navigation principale">
          <a href="#/home" data-nav="home">Accueil</a>
          <a href="#/normal" data-nav="normal">Défi Elo</a>
          <a href="#/revision" data-nav="revision">Révision</a>
          <a href="#/pedantix" data-nav="pedantix">Pédantix</a>
        </nav>

        <a class="teacher-link" href="#/teacher" data-nav="teacher">
          <span aria-hidden="true">＋</span>
          <span>Outil enseignant</span>
        </a>
      </div>
    </header>

    <main id="app" tabindex="-1">
      <section class="loading-view" aria-live="polite" aria-busy="true">
        <div class="loading-view__leaf" aria-hidden="true"></div>
        <p class="eyebrow">Préparation de votre session</p>
        <h1>La serre se met en place…</h1>
        <div class="loading-bar" aria-hidden="true"><span></span></div>
      </section>
    </main>

    <footer class="site-footer">
      <div>
        <strong>PlantQuiz</strong>
        <span>Un projet pédagogique du parcours Biologie Végétale de Montpellier.</span>
      </div>
      <a href="https://github.com/EdeZi/plantquiz" target="_blank" rel="noreferrer">Voir le projet sur GitHub ↗</a>
    </footer>
  </div>

  <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>

  <noscript>
    <div class="noscript">PlantQuiz a besoin de JavaScript pour lancer les quiz.</div>
  </noscript>
  <script type="module" src="./assets/js/app.js?v=3"></script>
</body>
</html>
